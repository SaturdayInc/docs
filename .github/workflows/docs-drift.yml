name: Docs Drift

# Docs-vs-API drift, docs-repo half.
#
# The published docs are what a partner builds against before they ever call us.
# When the backend renames a field, retires an endpoint or changes an event
# name, nothing noticed that the docs still described the old behaviour, and the
# drift got found by a customer whose integration broke.
#
# The drift check itself does not run here. It reads fuel-backend's private
# source, and this repository is public: the org's self-hosted runners refuse
# public repositories (a stranger's pull request would run on alex-desktop), and
# a fuel-backend credential in this repo's settings would sit one leaked token
# away from the engine source (issue #36). So fuel-backend's Docs Drift workflow
# runs the check on every backend pull request against docs@main, and hourly
# against docs main and fuel-backend main, which catches a merged page that names
# an endpoint, field or event the API does not have within about an hour. Before
# merging a page like that, run the check locally (README, "Local checks").
#
# The checker and the baseline live HERE, in one copy. fuel-backend clones this
# repo and runs this script, so there is one definition of drift.
#
# WHAT A GREEN RUN DOES NOT PROVE: that the numbers are right. Every check is
# structural. A page stating a default of 60 g/hr against code that says 90
# passes cleanly. See the script header for what closing that would take.
#
# ORDERING HAZARD, stated because it will happen. A rename that spans both repos
# cannot make both sides green at the same instant: the docs cannot name a field
# that fuel-backend@main does not have yet, and the backend cannot remove one the
# docs still cite. Removals sequence cleanly, docs first, because deleting a
# mention never introduces drift. A rename does not: land both, and the hourly
# run goes green once both are on main. Do not "solve" it by widening the
# baseline, which is what the job below exists to prevent.

on:
  pull_request:
    branches: [main]
    paths:
      - 'api-drift-baseline.txt'
      - '.github/workflows/docs-drift.yml'

jobs:
  # The baseline records drift that predates the gate so unrelated PRs are not
  # blocked by it. That only holds while it can shrink and not grow: a baseline
  # a PR may append to is an off switch, and the next real regression gets
  # written into it instead of reported. Removing entries is the point and is
  # always allowed.
  #
  # GitHub-hosted: this reads only this public repo, and hosted minutes are free
  # for public repos (engine-constants.yml has the full reasoning).
  baseline-shrink-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject additions to the drift baseline
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          added=$(git diff "$base"...HEAD -- api-drift-baseline.txt \
                  | awk '/^\+[^+#]/ { count++ } END { print count+0 }')
          removed=$(git diff "$base"...HEAD -- api-drift-baseline.txt \
                    | awk '/^-[^-#]/ { count++ } END { print count+0 }')
          echo "baseline entries removed by this PR: $removed"
          echo "baseline entries added by this PR:   $added"
          if [ "$added" -gt 0 ]; then
            echo
            echo "This PR adds $added entr(y/ies) to api-drift-baseline.txt."
            echo "The baseline is shrink-only. It holds the drift that already"
            echo "existed when the gate landed; a new entry hides a new problem."
            echo "Fix the drift the checker named, or if the checker is wrong"
            echo "about it, say so in review and change the checker instead."
            git diff "$base"...HEAD -- api-drift-baseline.txt | grep -E '^\+[^+#]' || true
            exit 1
          fi
          echo "Baseline did not grow."
